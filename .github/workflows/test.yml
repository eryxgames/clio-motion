name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript reference
        run: node js/test/run.js
      - name: C against the reference
        run: make -C c test
      - name: Python against the reference
        run: |
          python python/tests/test_kernel.py
          python python/tests/test_ground.py
          python python/tests/test_body.py
      - name: The C and Python examples draw the same picture
        run: |
          for n in soldier horse scorpion octopus; do
            c/examples/live2d_svg $n /tmp/$n.c.svg
            python python/examples/live2d_svg.py $n /tmp/$n.py.svg
            cmp /tmp/$n.c.svg /tmp/$n.py.svg
          done
      - name: The bench builds
        run: python bench/build.py
