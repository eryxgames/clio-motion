# Builds CLIo Motion's shared library (the C core for programs that load it at run time: Python, C#, an engine's
# extension) for every machine CLIo runs on, checks each build that can run here through Python against the
# recorded runs of the reference (python/tests/test_native.py, with the library required), and - for a tag like
# v0.25.0 - makes a GitHub release: clio-motion-VERSION-PLATFORM.zip for each machine and checksums.txt.
#
# A tag must match CM_VERSION in c/clio_motion.h and have a "## VERSION" section in CHANGELOG.md.
# To release: git tag v0.25.0 && git push origin v0.25.0 - the release is made here, with its files. One made by
# hand on GitHub first (which also makes the tag) is kept as it was written and given the files.
# Every push to main keeps the builds as artifacts of its run, so a library can be had without a release.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: linux-x64,           os: ubuntu-24.04,      kind: unix,    runs: true }
          - { plat: linux-arm64,         os: ubuntu-24.04-arm,  kind: unix,    runs: true }
          - { plat: macos-universal,     os: macos-15,          kind: unix,    runs: true }
          - { plat: windows-x64,         os: windows-2022,      kind: msvc,    runs: true,  arch: x64 }
          - { plat: windows-arm64,       os: windows-2022,      kind: msvc,    runs: false, arch: amd64_arm64 }
          - { plat: android-arm64-v8a,   os: ubuntu-24.04,      kind: android, runs: false, cc: aarch64-linux-android21-clang }
          - { plat: android-armeabi-v7a, os: ubuntu-24.04,      kind: android, runs: false, cc: armv7a-linux-androideabi21-clang }
          - { plat: android-x86_64,      os: ubuntu-24.04,      kind: android, runs: false, cc: x86_64-linux-android21-clang }
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (Linux)
        if: matrix.kind == 'unix' && startsWith(matrix.plat, 'linux')
        run: |
          make -C c test shared
          # it must load on older Linux too: no glibc symbol newer than 2.17
          need=$(objdump -T c/build/libclio_motion.so | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "needs $need"
          test "$(printf '%s\nGLIBC_2.17\n' "$need" | sort -V | tail -1)" = GLIBC_2.17

      - name: Build and test (macOS, Intel and Apple silicon in one)
        if: matrix.kind == 'unix' && startsWith(matrix.plat, 'macos')
        run: |
          make -C c test shared CFLAGS="-std=c99 -O2 -arch x86_64 -arch arm64 -mmacosx-version-min=10.13" \
                                LDFLAGS="-arch x86_64 -arch arm64 -mmacosx-version-min=10.13"
          lipo -info c/build/libclio_motion.dylib

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.kind == 'msvc'
        with:
          arch: ${{ matrix.arch }}

      - name: Build (Windows)
        if: matrix.kind == 'msvc'
        shell: cmd
        working-directory: c
        run: build.bat

      - name: Build (Android)
        if: matrix.kind == 'android'
        run: |
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}"
          make -C c shared CC="$CC"
          file c/build/libclio_motion.so

      - uses: actions/setup-python@v5
        if: matrix.runs
        with:
          python-version: "3.12"

      - name: The same as the reference, through Python
        if: matrix.runs
        shell: bash
        run: |
          case "${{ matrix.plat }}" in
            windows-*) lib="$(pwd -W)/c/build/clio_motion.dll" ;;
            macos-*)   lib="$PWD/c/build/libclio_motion.dylib" ;;
            *)         lib="$PWD/c/build/libclio_motion.so" ;;
          esac
          CLIO_MOTION_LIB="$lib" CLIO_MOTION_REQUIRE=1 python python/tests/test_native.py

      - name: Pack
        shell: bash
        run: |
          version=$(sed -n 's/^#define CM_VERSION "\(.*\)"/\1/p' c/clio_motion.h)
          name="clio-motion-$version-${{ matrix.plat }}"
          mkdir -p "$name/lib" "$name/include"
          case "${{ matrix.plat }}" in
            windows-*) cp c/build/clio_motion.dll c/build/clio_motion.lib "$name/lib/" ;;
            macos-*)   cp c/build/libclio_motion.dylib "$name/lib/" ;;
            *)         cp c/build/libclio_motion.so "$name/lib/" ;;
          esac
          cp c/clio_motion.h "$name/include/"
          cp LICENSE NOTICE README.md CHANGELOG.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            zip -qr "$name.zip" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plat }}
          path: clio-motion-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^#define CM_VERSION "\(.*\)"/\1/p' c/clio_motion.h)
          echo "tag $version, header $header"
          test "$version" = "$header"
          awk -v v="$version" '$1=="##" && $2==v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum clio-motion-*.zip > checksums.txt
          cat checksums.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME is there already: adding its files"
            gh release upload "$GITHUB_REF_NAME" dist/clio-motion-*.zip dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/clio-motion-*.zip dist/checksums.txt \
              --title "CLIo Motion $VERSION" --notes-file notes.md
          fi
